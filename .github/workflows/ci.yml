name: CI

on:
  pull_request:
    branches: [main, staging, dev]

# Un seul run par PR — annule les runs précédents si un nouveau push arrive
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Backend ────────────────────────────────────────────────────
  backend-ci:
    name: Backend — lint / typecheck / test / build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # Monorepo npm workspaces (package.json racine) — npm ci se fait
      # depuis la racine avec le lockfile racine, jamais depuis
      # apps/backend/ isolément (voir apps/backend/Dockerfile, même
      # correctif appliqué le 2026-08-10 après avoir trouvé que les
      # lockfiles imbriqués de chaque app n'étaient plus maintenus
      # depuis l'introduction des workspaces pour turborepo).
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=apps/backend

      - name: Lint
        run: npm run lint --workspace=apps/backend

      - name: Type check
        run: npm run typecheck --workspace=apps/backend

      - name: Unit tests
        run: npm run test --workspace=apps/backend

      # testcontainers démarre un vrai Postgres jetable via le démon
      # Docker déjà présent sur les runners ubuntu-latest. Les variables
      # d'environnement requises par env.validation.ts (placeholders,
      # jamais de vrais secrets) sont fournies par test/env-setup.ts
      # (setupFiles Jest) — même fichier utilisé en local, voir ce
      # fichier pour le détail.
      - name: e2e tests
        run: npm run test:e2e --workspace=apps/backend

      - name: Build
        run: npm run build --workspace=apps/backend

  # ── Frontend ───────────────────────────────────────────────────
  frontend-ci:
    name: Frontend — lint / typecheck / test / build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=apps/frontend

      - name: Type check
        run: npm run typecheck --workspace=apps/frontend

      - name: Unit tests
        run: npm run test --workspace=apps/frontend

      - name: Build production
        run: npm run build --workspace=apps/frontend
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.up.railway.app/api
